# yaml-language-server: $schema=../../schemas/projects.schema.json
# Projects page. `categories` drive the filter buttons; each project's `category` must match a category id.
#
# Project fields:
#   name, category, date, priority, description, tags  (required)
#   date           : "YYYY-MM" — when it was built (or started, if `ongoing: true`)
#   date_estimated : true = tentative date to confirm later (not shown on the site)
#   priority       : 1–100, higher shows first; keep simple projects low. Featured projects always lead.
#   featured       : true to show as the wide card at the top (with `stats`)
#   label          : overrides the auto "PROJECT_01" numbering
#   links          : optional { github, demo, paper } — PUBLIC repos only, never link a private repo

categories:
  - id: mlops
    label: MLOPS / INFRA
  - id: llm
    label: LLM / RAG
  - id: speech
    label: SPEECH AI
  - id: cv
    label: COMPUTER VISION
  - id: genai
    label: GENERATIVE AI
  - id: edge
    label: EDGE AI

items:
  - name: AI Studio
    featured: true
    label: FYP — FINAL YEAR PROJECT
    category: mlops
    date: "2024-12"
    date_estimated: true
    priority: 90
    description: >-
      Cloud-native AI deployment platform with end-to-end MLOps workflows. Includes a model registry,
      experiment tracking, workflow automation, and one-click deployment to production. Built as the
      Final Year Project at Pak-Austria Fachhochschule.
    tags: [MLOps, Cloud-Native, Model Registry, Workflow Automation, Kubernetes]
    stats:
      - value: Cloud
        label: DEPLOYMENT_TARGET
      - value: K8s + CI/CD
        label: INFRASTRUCTURE
      - value: FYP
        label: PROJECT_TYPE

