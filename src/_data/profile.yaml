# Home page stats row. Use `value` for fixed text, or `auto` to compute from the data:
#   years_experience -> from the earliest start date in experience.yaml (e.g. "4+")
#   roles            -> number of entries in experience.yaml (e.g. "5+")
#   projects         -> number of entries in projects.yaml
stats:
  - auto: years_experience
    label: Years Experience
  - value: IEEE
    label: Published
  - auto: roles
    label: Roles & Internships
  - value: 500+ # TODO(confirm): only 12 projects are listed — is 500+ a real count (e.g. freelance gigs)?
    label: AI Projects

# The two floating badges on the home page portrait.
